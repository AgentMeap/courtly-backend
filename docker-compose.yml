# Run the whole backend with Docker: SQL Server + database creation + Spring Boot app.
#   docker compose up -d --build
# Variables are read from the .env file next to this file (see .env.example).
# Only the variables below are passed into the containers; nothing else from .env is copied.

name: courtly

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # SQL Server requires a strong password: >= 8 chars with upper, lower, digit and symbol
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Dat MSSQL_SA_PASSWORD (mat khau manh) trong .env}
    ports:
      # Host port 14330 so it does not clash with a SQL Server already installed on the machine (1433)
      - "${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot job: create CourtlyDB and CourtlyDB_Test (tables are created by Flyway when the app starts)
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./docs/sql/create_database.sql:/scripts/create_database.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /scripts/create_database.sql"]
    restart: "no"

  app:
    build: .
    image: courtly-backend:latest
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=CourtlyDB;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Required in Docker: the dev default secret is not used here
      JWT_SECRET: ${JWT_SECRET:?Dat JWT_SECRET (>= 32 ky tu) trong .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SHOW_SQL: ${SHOW_SQL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
    restart: unless-stopped

volumes:
  sqlserver-data:
