spring.application.name=badminton_backend

# Doc bi mat (DB_PASSWORD, MAIL_PASSWORD, ...) tu file .env o thu muc goc (da gitignore).
# Xem .env.example. Bien moi truong that van duoc uu tien hon file .env.
spring.config.import=optional:file:.env[.properties]

# ===== SQL Server (moi gia tri nhay cam lay tu bien moi truong / .env) =====
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CourtlyDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
# Khong co mat khau mac dinh: thieu DB_PASSWORD thi app dung ngay voi thong bao ro rang
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Flyway: schema do Flyway quan ly, Hibernate chi validate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Logging =====
# Log SQL de debug khi dev; dat SHOW_SQL=false khi deploy
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}
logging.level.com.se183891.badminton_backend=${APP_LOG_LEVEL:INFO}

# ===== JWT =====
# Secret mac dinh CHI DUNG CHO DEV. Khi deploy (SPRING_PROFILES_ACTIVE=prod) bat buoc phai co JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-courtly-jwt-secret-change-me-0123456789abcdef}
app.jwt.issuer=courtly
app.jwt.access-token-ttl=30m
app.jwt.refresh-token-ttl=7d

# ===== CORS (origin dev: Flutter web / emulator) =====
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}

# ===== Seed tai khoan mau (tu tat khi SPRING_PROFILES_ACTIVE=prod) =====
app.seed.enabled=${SEED_ENABLED:true}
app.seed.default-password=${SEED_PASSWORD:123456}

# ===== Email (Gmail SMTP) de gui OTP =====
# MAIL_USERNAME: dia chi Gmail gui; MAIL_PASSWORD: App Password 16 ky tu (KHONG phai mat khau Gmail).
# Chua dat 2 bien nay thi /api/auth/register/send-otp tra 503.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Dia chi email nguoi gui (de trong = dung MAIL_USERNAME). Ten hien thi "Courtly" do code tu gan.
app.mail.from=${MAIL_FROM:}

# ===== OTP dang ky =====
app.otp.ttl=5m
app.otp.resend-cooldown=60s
app.otp.max-attempts=5
app.otp.max-sends-per-hour=5

# ===== Firebase / Google sign-in (mac dinh TAT) =====
# TODO(FIREBASE): doi thanh true (hoac set FIREBASE_ENABLED=true) sau khi co service account key.
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
